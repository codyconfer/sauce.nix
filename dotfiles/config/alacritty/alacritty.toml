[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = false
opacity = 0.8
dimensions = { columns = 120, lines = 69 }

[scrolling]
history = 500

[font]
size = 8

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

# Match the COSMIC dark desktop palette and green accent.
[colors.primary]
background = "#1b1b1b"
foreground = "#f5f5f5"

[colors.cursor]
text = "#1b1b1b"
cursor = "#92cf9c"

[colors.selection]
text = "#1b1b1b"
background = "#92cf9c"

[colors.normal]
black = "#1b1b1b"
red = "#fda1a0"
green = "#92cf9c"
yellow = "#f7e062"
blue = "#a1c0eb"
magenta = "#e79cfe"
cyan = "#63d0df"
white = "#dedede"

[colors.bright]
black = "#636363"
red = "#ffa09a"
green = "#5edb8c"
yellow = "#fedb40"
blue = "#a1c0eb"
magenta = "#e79cfe"
cyan = "#63d0df"
white = "#ffffff"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
