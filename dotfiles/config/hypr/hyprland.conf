$mainMod = SUPER
$terminal = foot
$menu = fuzzel

monitor = , preferred, auto, 1

input {
    kb_layout = us
    repeat_delay = 300
    repeat_rate = 40
    touchpad {
        tap-to-click = true
        natural_scroll = false
        disable_while_typing = true
    }
}

general {
    gaps_in = 6
    gaps_out = 0
    border_size = 2
    col.active_border = rgb(03a9f4)
    col.inactive_border = rgb(37474f)
    layout = dwindle
}

decoration {
    rounding = 2
}

dwindle {
    preserve_split = true
}

exec-once = uwsm finalize
exec-once = uwsm app -s b -- waybar --config $HOME/.config/waybar/config-hyprland.jsonc
exec-once = uwsm app -s b -- mako
exec-once = uwsm app -s b -- wl-paste --watch cliphist store
exec-once = uwsm app -s b -- wl-clip-persist --clipboard regular
exec-once = uwsm app -s b -- sauce-power daemon

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, BACKSPACE, killactive
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, E, exec, waylogout
bind = $mainMod, ESCAPE, exec, sauce-power lock
bind = $mainMod, F5, exec, brightnessctl set 15%
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, X, exec, $menu
bind = $mainMod SHIFT, X, exec, sauce-clipboard
bind = $mainMod SHIFT, R, exec, kooha
bind = $mainMod, TAB, cyclenext
bind = $mainMod SHIFT, TAB, cyclenext, prev
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, DOWN, movefocus, d
bind = $mainMod, UP, movefocus, u
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, LEFT, movewindow, l
bind = $mainMod SHIFT, DOWN, movewindow, d
bind = $mainMod SHIFT, UP, movewindow, u
bind = $mainMod SHIFT, RIGHT, movewindow, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, B, layoutmsg, togglesplit
bind = $mainMod, V, layoutmsg, togglesplit
bind = $mainMod, E, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod SHIFT, MINUS, movetoworkspace, special
bind = $mainMod, MINUS, togglespecialworkspace

bind = , PRINT, exec, grim - | wl-copy
bind = CTRL, PRINT, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/$(date +%F_%T).png"
bind = $mainMod, PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, PRINT, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%F_%T).png"

bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86PowerOff, exec, sauce-power button

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
